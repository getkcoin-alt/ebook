[project]
name = "knowledgeos-workspace"
version = "0.1.0"
description = "KnowledgeOS monorepo - Python workspace root (tooling config only)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "node_modules", "migrations/versions", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "S",    # bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "S101",   # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "T20"]
"**/conftest.py" = ["S", "T20"]
"**/scripts/**" = ["T20"]

[tool.ruff.lint.isort]
# Services run with their own directory on PYTHONPATH and import their modules
# flat (`from models import Book`). Without listing them, ruff classifies those as
# third-party and every service file fails I001.
known-first-party = [
    "knowledgeos_core",
    "cookies",
    "deps",
    "main",
    "migrations",
    "models",
    "routers",
    "schemas",
    "services",
    "settings",
    "tasks",
    "tests",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions", "node_modules", ".venv"]

[[tool.mypy.overrides]]
module = ["tests.*", "*.tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# No `testpaths`. Running pytest from the repository root cannot collect this
# monorepo: every service defines its own top-level `models`, `schemas`, `settings`
# and `tests` modules, so two `tests/conftest.py` files under one rootdir fail
# collection outright — and if they did not, the first service to import `models`
# would win for every service collected after it.
#
# Use `scripts/test-python.sh`, which runs one pytest process per service with that
# service's PYTHONPATH — the same way it runs in its own container.
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests requiring live infrastructure (postgres/redis/minio)",
    "slow: long-running tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/migrations/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
