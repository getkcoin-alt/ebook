apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Must match prometheus.yml's scrape_interval, or Grafana computes rate()
      # windows that are too short and renders gaps.
      timeInterval: 15s
      httpMethod: POST
