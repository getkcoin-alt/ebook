# Local development stack.
#
#   pnpm stack:up      start infrastructure
#   pnpm stack:logs    tail everything
#   pnpm stack:reset   destroy volumes and start clean
#
# This file provisions the *backing services* only (Postgres, Redis, MinIO,
# Meilisearch, Mailpit, Prometheus, Grafana). Application services are run from
# the host with hot reload during development — rebuilding an image on every edit
# is far slower than uvicorn's reloader.
#
# To run the full containerised stack instead:
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml up

name: knowledgeos

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 20s

services:
  postgres:
    image: postgres:17-alpine
    container_name: kos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledgeos
      POSTGRES_PASSWORD: knowledgeos_dev_password
      POSTGRES_DB: knowledgeos
      # C collation makes text sorting deterministic and index scans faster;
      # locale-aware collation is not needed for ids and slugs.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      # Dev-friendly tuning: log slow queries so N+1s surface during development.
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=200
      - -c
      - log_statement=none
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgeos -d knowledgeos"]
      <<: *healthcheck-defaults

  redis:
    image: redis:7-alpine
    container_name: kos-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command:
      # appendonly so queued Celery jobs survive a container restart in dev, which
      # matches the production Railway Redis configuration.
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-defaults

  minio:
    image: minio/minio:latest
    container_name: kos-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: knowledgeos
      MINIO_ROOT_PASSWORD: knowledgeos_dev_password
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      <<: *healthcheck-defaults

  # One-shot: create the bucket and make the public/ prefix readable.
  minio-init:
    image: minio/mc:latest
    container_name: kos-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 knowledgeos knowledgeos_dev_password &&
      mc mb --ignore-existing local/knowledgeos &&
      mc anonymous set download local/knowledgeos/public &&
      echo 'MinIO bucket ready' "
    restart: "no"

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: kos-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: knowledgeos_dev_master_key_min_16_bytes
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      <<: *healthcheck-defaults

  # Catches every outbound email in development. Nothing can escape to a real
  # inbox, which matters the first time a seed script loops over 500 users.
  mailpit:
    image: axllent/mailpit:latest
    container_name: kos-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      <<: *healthcheck-defaults

  prometheus:
    image: prom/prometheus:latest
    container_name: kos-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:latest
    container_name: kos-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles: ["monitoring"]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  meili-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: knowledgeos
