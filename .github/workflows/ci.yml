name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run — no point burning
# minutes on a commit that has already been superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Work out what actually changed, so a frontend-only PR does not run the
  # entire Python matrix (and vice versa).
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'apps/**/*.py'
              - 'apps/**/requirements*.txt'
              - 'packages/core-py/**'
              - 'pyproject.toml'
            frontend:
              - 'apps/frontend/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            docker:
              - '**/Dockerfile'
              - 'infrastructure/docker/**'

  # ---------------------------------------------------------------------------
  # Python: lint, type check, test.
  # ---------------------------------------------------------------------------
  python-lint:
    name: Python lint & format
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
      - name: Check formatting
        run: ruff format --check .

  python-test:
    name: Python tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: knowledgeos
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: knowledgeos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U knowledgeos"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://knowledgeos:test_password@localhost:5432/knowledgeos_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      INTERNAL_API_SECRET: ci-internal-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install core + service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/core-py[dev,tasks]"
          for req in apps/*/requirements.txt; do
            [ -f "$req" ] && pip install -r "$req"
          done
      - name: Run tests with coverage
        run: |
          pytest --cov --cov-report=xml --cov-report=term-missing \
                 --junitxml=junit.xml -o junit_family=legacy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: |
            junit.xml
            coverage.xml
          retention-days: 7

  python-typecheck:
    name: Python type check
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e "packages/core-py[dev,tasks]" mypy
          for req in apps/*/requirements.txt; do
            [ -f "$req" ] && pip install -r "$req"
          done
      - run: mypy packages/core-py/knowledgeos_core

  # ---------------------------------------------------------------------------
  # Frontend & shared TypeScript packages.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend lint, types & tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  e2e:
    name: End-to-end (Playwright)
    needs: [changes, frontend]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @knowledgeos/frontend exec playwright install --with-deps chromium
      - run: pnpm --filter @knowledgeos/frontend test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Verify every service image builds. Uses the GitHub Actions cache so a
  # dependency layer is not rebuilt on every PR.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Build ${{ matrix.service }} image
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - auth
          - books
          - search
          - ai
          - payment
          - notifications
          - automation
          - admin
          - workers
    steps:
      - uses: actions/checkout@v4
      - name: Skip if the service has no Dockerfile yet
        id: guard
        run: |
          if [ -f "apps/${{ matrix.service }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "apps/${{ matrix.service }}/Dockerfile not present; skipping."
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.guard.outputs.exists == 'true'
      - uses: docker/build-push-action@v6
        if: steps.guard.outputs.exists == 'true'
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          load: false
          tags: knowledgeos/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

  # ---------------------------------------------------------------------------
  # Single required status check, so branch protection needs one rule rather
  # than one per job (and still fails when any job fails).
  # ---------------------------------------------------------------------------
  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [python-lint, python-test, python-typecheck, frontend, e2e, docker-build]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          # A skipped job is fine (its paths did not change); a failure is not.
          if echo "$results" | grep -q '"result": *"failure"'; then
            echo "::error::At least one CI job failed."
            exit 1
          fi
          if echo "$results" | grep -q '"result": *"cancelled"'; then
            echo "::error::At least one CI job was cancelled."
            exit 1
          fi
          echo "All CI jobs passed or were skipped."
