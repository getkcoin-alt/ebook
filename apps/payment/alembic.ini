# Alembic configuration for the payment service.
# This service owns the `auth` schema and its own migration chain; it never
# migrates another service's tables (see docs/adr/0002-database-topology.md).

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# The URL is supplied by env.py from DATABASE_URL, so it is never committed.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
